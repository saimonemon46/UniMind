name: UniMind CI

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - development
      - main

jobs:
  # ==========================================
  # Django Backend
  # ==========================================
  backend:
    name: Django Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          python manage.py check

      - name: Run Django tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          python manage.py test

  # ==========================================
  # FastAPI AI Service
  # ==========================================
  ai-service:
    name: FastAPI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai_service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai_service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run tests
        env:
          PYTHONPATH: ..:.
        run: |
          pytest

  # ==========================================
  # React Frontend
  # ==========================================
  frontend:
    name: React Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Build frontend
        run: |
          npm run build

  # ==========================================
  # Docker Build Validation
  # ==========================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - ai-service
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Django image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: unimind-django:test

      - name: Build FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: ./ai_service
          push: false
          tags: unimind-fastapi:test

      - name: Build React image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: unimind-frontend:test

